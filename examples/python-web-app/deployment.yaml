apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: python-app
        image: python-sample-app-demo:v1
        env:
          - name: DB-PORT
            valueFrom: # The value of DB-PORT env varibale is obtaibned from config maps test-cm 
              configMapKeyRef:
                name: test-cm
                key: db-port 
        ports:
        - containerPort: 8000
